name: Build Android APK

on:
  push:
    branches: [mobile]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Configure build (single ABI + SDK path)
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          grep -q "reactNativeArchitectures" android/gradle.properties || echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          cat android/local.properties

      - name: Build release APK
        env:
          EXPO_PUBLIC_API_BASE: https://www.pcmuz.cn
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esponal-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/release/ || true
